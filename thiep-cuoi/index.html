<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thiệp Cưới Online</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Montserrat:wght@300;400;600&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">

  <!-- File CSS riêng -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Audio phát nhạc -->
  <audio id="bgMusic" src="nhac_intro1.mp3" loop></audio>

  <!-- Nút đĩa nhạc -->
  <button id="musicToggle" class="music-btn" onclick="toggleMusic()" title="Bật/Tắt nhạc">🎵</button>

  <div class="mobile-container">
    
    <!-- 1. Bìa mở thiệp -->
    <div id="cover-screen">
      <div class="cover-title">Save The Date</div>
      <div class="cover-names">Minh Trí & Thùy Dung</div>
      <button class="btn-open" onclick="openInvitation()">CHẠM ĐỂ MỞ THIỆP</button>
    </div>

    <!-- 2. Thân thiệp -->
    <div class="invitation-body">
      <div class="invitation-tag">Lễ Thành Hôn</div>
      
      <div class="couple-names">
        HOÀNG MINH TRÍ
        <span>&</span>
        TRẦN THÙY DUNG
      </div>

      <!-- Ảnh cưới chính -->
      <img src="anh-cuoi.jpg" alt="Ảnh cưới" class="hero-photo">

      <!-- Thông tin địa điểm & thời gian -->
      <div class="event-card">
        <h3 class="event-title">TIỆC MỪNG THÀNH HÔN</h3>
        <p class="event-time">11:00 — Chủ Nhật, 20/12/2026</p>
        <p class="event-lunar">(Nhằm ngày 12 tháng 11 năm Bính Ngọ)</p>
        
        <p class="event-address">
          <strong>Trung tâm Tiệc cưới Trống Đồng Palace</strong><br>
          Số 65 Quán Sứ, Hoàn Kiếm, Hà Nội
        </p>

        <a href="https://maps.google.com" target="_blank" class="btn-maps">
          📍 Xem chỉ đường Google Maps
        </a>
      </div>

    </div>
  </div>

  <!-- File JavaScript riêng -->
  <script src="script.js"></script>
</body>
</html>
